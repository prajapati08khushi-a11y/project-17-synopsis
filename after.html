<!DOCTYPE html>
<html lang="en"><head><link rel="stylesheet" href="style.css"></head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH FEST 2026</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101a3c, #34206b);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.container {
    max-width: 750px;
    width: 100%;
    text-align: center;
    padding: 55px 25px;
    border-radius: 25px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 15px 45px rgba(0,0,0,0.3);
}

h1 {
    font-size: clamp(35px, 7vw, 60px);
    margin-bottom: 20px;
    color: #ffd166;
}

p {
    font-size: 18px;
    line-height: 1.7;
}

button {
    margin: 20px 0;
    padding: 15px 32px;
    border: none;
    border-radius: 30px;
    background: #ffd166;
    color: #172044;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

h2 {
    margin-top: 30px;
    color: #8be9fd;
}

.events {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
}

.events p {
    background: rgba(255,255,255,0.15);
    padding: 10px 18px;
    border-radius: 20px;
}
</style>
</head>

<body>
<div class="container">
    <h1>TECH FEST 2026</h1>
    <p>Three days of technology, robotics and creativity.</p>
    <button>Register now</button>
    <h2>Our Events</h2>
    <div class="events">
        <p>Robotics · Coding · Gaming</p>
    </div>
</div>
</body>
</html>
